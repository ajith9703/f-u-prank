<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Surprise 😂</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    .message {
      display: none;
      font-size: 2.5rem;
      text-align: center;
      animation: fadeIn 1s ease-in-out forwards;
    }

    .emoji {
      font-size: 8rem;
      margin-top: 30px;
      animation: pop 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="main" class="message">
    <div>FUCK YOU 😈</div>
    <div class="emoji">🖕</div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("main").style.display = "block";
    }, 2500); // 2.5 second delay before surprise
  </script>

</body>
</html>
